name: CI Pipeline (Integración Continua)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js (v24)
      uses: actions/setup-node@v4
      with:
        node-version: '24' 

    - name: 3. Instalar dependencias
      run: npm install

    - name: 4. Probar que el proyecto compile (Build)
      run: npm run build

    - name: 5. Ejecutar pruebas unitarias
      run: npm test
